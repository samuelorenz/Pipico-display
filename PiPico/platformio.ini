; PlatformIO Project Configuration File
;
; Un firmware unico con tutti i temi, oppure uno solo (per ottenere un firmware piu' piccolo):
;   pio run -e all       -t upload   (tutti i temi: si cambia con T,<tema> o con il pulsante)  [predefinito]
;   pio run -e fallout   -t upload   (solo RobCo Industries)
;   pio run -e skynet    -t upload   (solo Skynet / T-800)
;   pio run -e cyberpunk -t upload   (solo Cyberpunk 2077)

[platformio]
default_envs = all

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = custom
monitor_port = COM7
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library

[env:all]
build_src_filter = -<*> +<main.cpp> +<common/> +<fallout/> +<skynet/> +<cyberpunk/>
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File upload.ps1 .pio/build/all/firmware.uf2

[env:fallout]
build_flags = -DONLY_FALLOUT
build_src_filter = -<*> +<main.cpp> +<common/> +<fallout/>
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File upload.ps1 .pio/build/fallout/firmware.uf2

[env:skynet]
build_flags = -DONLY_SKYNET
build_src_filter = -<*> +<main.cpp> +<common/> +<skynet/>
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File upload.ps1 .pio/build/skynet/firmware.uf2

[env:cyberpunk]
build_flags = -DONLY_CYBERPUNK
build_src_filter = -<*> +<main.cpp> +<common/> +<cyberpunk/>
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File upload.ps1 .pio/build/cyberpunk/firmware.uf2
